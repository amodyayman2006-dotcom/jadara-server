<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجلة جامعة جدارا الإلكترونية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--navy:#2b2878;--teal:#5ab3cf;--green:#4b9a7e;--red:#c4302b;--gold:#c9a56a;--ink:#1c2033;--mute:#64698a;--line:#e6e9f0;--soft:#f6f8fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.8}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.w{max-width:1200px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);z-index:5}
.bar{display:flex;align-items:center;gap:24px;padding:8px 0}
.logo{height:64px;width:auto;cursor:pointer;display:block}
.name b{font-size:19px;color:var(--navy);display:block;line-height:1.3}.name small{color:var(--mute);font-size:11px;letter-spacing:.1em}
nav{margin-inline-start:auto;display:flex;gap:22px;font-size:14.5px;overflow-x:auto;white-space:nowrap}
nav a{color:var(--mute);padding:4px 0;border-bottom:2px solid transparent;transition:.2s}nav a:hover{color:var(--navy);border-color:var(--teal)}
.hero{display:grid;grid-template-columns:2fr 1fr;gap:28px;padding:32px 0}
.art{display:block;width:100%;height:100%;border-radius:4px}
.main{position:relative;min-height:440px}
.cap{position:absolute;inset-inline:0;bottom:0;background:#fff;margin:0 28px;padding:22px 26px;border-top:3px solid var(--red);box-shadow:0 -6px 24px rgba(43,40,120,.07)}
.cap h1{margin:0 0 6px;font-size:27px;line-height:1.55;color:var(--navy)}.cap p{margin:0 0 10px;color:var(--mute);font-size:15px}
.k{font-size:12px;color:var(--red);font-weight:600}.d{font-size:12px;color:var(--mute)}
.btn{background:var(--navy);color:#fff;border:0;padding:8px 20px;border-radius:3px;font-weight:500;transition:.2s}.btn:hover{background:#1f1c5c}
.btn.o{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.o:hover{border-color:var(--teal)}.btn.r{color:var(--red)}
.side{display:flex;flex-direction:column;gap:18px}.side a{display:grid;grid-template-columns:96px 1fr;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.side .art{height:78px}.side h3{margin:0;font-size:15px;line-height:1.6}
section{padding:40px 0}.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:10px}
.sh h2{margin:0;font-size:24px;color:var(--navy)}.sh h2::after{content:"";display:block;width:40px;height:3px;background:var(--teal);margin-top:6px}.sh a{font-size:13px;color:var(--mute)}
.news{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:auto;gap:22px}
.n{transition:.25s}.n:hover{transform:translateY(-3px)}.n .art{height:170px;margin-bottom:10px}.n h3{margin:2px 0;font-size:16px;line-height:1.6}
.n.big{grid-column:span 2;grid-row:span 2}.n.big .art{height:330px}.n.big h3{font-size:22px}
.soft{background:var(--soft)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:0}.nums div{padding:6px 24px;border-inline-start:1px solid var(--line)}.nums b{font-size:34px;color:var(--navy);font-weight:600;display:block;line-height:1.3}.nums span{color:var(--mute);font-size:14px}
.note{font-size:12.5px;color:var(--mute);margin:16px 0 0}
.stars{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.st{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:.25s}.st:hover{box-shadow:0 10px 26px rgba(43,40,120,.1)}.st .art{height:230px;border-radius:0}.st div{padding:16px 18px}.st h3{margin:0;font-size:17px;color:var(--navy)}.st small{color:var(--green);font-weight:500}
.rows a{display:grid;grid-template-columns:84px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}.dt{text-align:center;border-inline-end:3px solid var(--teal);padding-inline-end:12px}.dt b{display:block;font-size:26px;color:var(--navy);line-height:1.2}.dt span{font-size:12px;color:var(--mute)}.rows h3{margin:0;font-size:16.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}.two .n .art{height:200px}
.art-list a{display:block;padding:14px 0;border-bottom:1px solid var(--line)}.art-list h3{margin:0;font-size:17px;font-family:inherit}.art-list q{quotes:none;color:var(--mute);font-size:14px}
.mos{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:12px}.mos .art{height:100%;transition:.3s}.mos .art:hover{filter:saturate(1.2)}.mos a:first-child{grid-column:span 2;grid-row:span 2}
.iss{display:flex;gap:22px;overflow-x:auto}.iss div{flex:0 0 170px}.iss .art{height:230px;box-shadow:0 8px 22px rgba(43,40,120,.14)}.iss small{display:block;margin-top:8px;color:var(--mute)}
.soc{display:flex;gap:16px;flex-wrap:wrap}.soc a{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:700;transition:.2s}.soc a:hover{transform:translateY(-4px);box-shadow:0 8px 18px rgba(0,0,0,.15)}
footer{border-top:3px solid var(--teal);background:var(--soft);padding:36px 0;font-size:14px;color:var(--mute)}footer .w{display:flex;gap:30px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.ov{position:fixed;inset:0;background:rgba(28,32,51,.35);display:none;place-items:center;z-index:30;padding:16px}.ov.on{display:grid}
.box{background:#fff;width:100%;max-width:420px;border-radius:6px;padding:26px;border-top:4px solid var(--navy);max-height:90vh;overflow:auto}.box h3{margin:0 0 14px;color:var(--navy)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;font:inherit;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);border-color:transparent}
.msg{font-size:13px;min-height:22px;margin:8px 0 0;color:var(--red)}.msg.ok{color:var(--green)}
#adm{display:none;min-height:100vh;background:var(--soft)}#adm.on{display:flex}
.sb{width:250px;background:#fff;border-inline-end:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.sb img{height:52px;display:block;margin:0 8px 14px}.sb button{display:block;width:100%;text-align:start;background:none;border:0;padding:9px 12px;border-radius:4px;color:var(--mute);font-size:14px}.sb button:hover{background:var(--soft)}.sb button.on{background:#eaf5f9;color:var(--navy);font-weight:600;border-inline-start:3px solid var(--teal)}
.ct{flex:1;padding:28px;min-width:0}.ct h2{margin:0 0 4px;color:var(--navy)}.ct>p{margin:0 0 20px;color:var(--mute);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}.cards div{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px}.cards b{font-size:28px;color:var(--navy);display:block}.cards span{font-size:13px;color:var(--mute)}
.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px;overflow-x:auto}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:start;color:var(--mute);font-weight:500;padding:8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid var(--line)}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;background:#eaf5f9;color:var(--navy)}.pill.pub{background:#e7f4ee;color:var(--green)}
.tg{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.up{border:2px dashed var(--line);border-radius:6px;padding:26px;text-align:center;color:var(--mute);margin-top:10px}
@media(max-width:860px){.hero,.two{grid-template-columns:1fr}.news,.stars,.nums{grid-template-columns:1fr 1fr}.stars{grid-template-columns:1fr}.main{min-height:380px}.cap{margin:0 12px}.cap h1{font-size:21px}.mos{grid-template-columns:1fr 1fr}.bar{flex-wrap:wrap}nav{width:100%;margin:0}#adm.on{display:block}.sb{width:100%;height:auto;position:static;display:flex;overflow-x:auto}.sb img{display:none}.sb button{white-space:nowrap;width:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.tk{background:#eaf5f9;color:var(--navy);font-size:13px;padding:5px 12px;text-align:center}
.ph{padding:34px 0 10px;border-bottom:1px solid var(--line);margin-bottom:26px}.ph h1{margin:0;color:var(--navy);font-size:32px}.ph p{margin:4px 0 0;color:var(--mute)}
.g3{grid-template-columns:repeat(3,1fr)}.g3 .n.big{grid-column:auto;grid-row:auto}.g3 .n.big .art{height:170px}.g3 .n.big h3{font-size:16px}
img.art{object-fit:cover}a.main{display:block}.det{max-width:780px;margin:30px auto}.det h1{font-size:34px;line-height:1.5;color:var(--navy);margin:6px 0}.det>.art{height:420px;margin:18px 0}.det p{font-size:17.5px;line-height:2}
.pdf{width:100%;height:600px;border:1px solid var(--line)}.shr{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.hs input{width:140px;padding:6px 10px}
.fl{margin-bottom:20px}.dm{font-size:11px;background:#fff6e5;color:#8a6a1f;padding:1px 8px;border-radius:3px}.fm{max-width:640px;margin:0 auto 40px}.fm .btn{margin-top:14px}
@media(max-width:860px){.g3{grid-template-columns:1fr}.hs{display:none}.det h1{font-size:25px}.det>.art{height:240px}}
.cv{margin:18px 0}.cv .art{height:420px}#pv{display:none;position:fixed;inset:0;background:#fff;z-index:40;overflow:auto;padding:20px}#pv.on{display:block}.pvp{max-width:760px;margin:auto}#lbo.on{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85)}.soc svg{width:28px;height:28px}
@media(max-width:860px){.cv .art{height:240px}}
@media print{#site,#adm,.ov,.noprint{display:none!important}#pv{position:static;display:block}}
</style>
</head>

const TXT={about:`<div class="det"><h1>عن المجلة</h1><p><b>الرؤية:</b> أن تكون مجلة جامعة جدارا الإلكترونية منصة جامعية رائدة وموثوقة في الإعلام المعرفي والرقمي، ونافذة تعكس التميز الأكاديمي والإبداع والابتكار والانفتاح على المجتمع والعالم.</p><p><b>الرسالة:</b> تقديم محتوى إعلامي احترافي يعكس مكانة جامعة جدارا، ويوثق مسيرتها الأكاديمية والبحثية والمجتمعية، ويعزز التواصل مع الطلبة والخريجين وأعضاء الهيئتين الأكاديمية والإدارية والمجتمع المحلي والدولي.</p><p><b>الأهداف:</b> إبراز إنجازات الجامعة، تعزيز صورتها وسمعتها، تسليط الضوء على التميز والبحث العلمي، اكتشاف المواهب، توثيق قصص النجاح، تقديم محتوى معرفي وثقافي، وتعزيز الحضور الرقمي.</p><p><b>الكادر التحريري المقترح:</b> رئيس التحرير، مدير التحرير، محرر صحفي، محرر علمي، مصمم جرافيك، مسؤول تقني، مصور ومونتير، ومراسلون طلابيون.</p><p class="d">المصدر: مقترح تأسيس مجلة جامعة جدارا الإلكترونية.</p></div>`,pol:`<div class="det"><h1>سياسة النشر</h1><p>تلتزم المجلة بسلامة اللغة ودقة الأسماء والمسميات الرسمية، والتحقق من المعلومات من مصادر موثوقة، واحترام الملكية الفكرية وموافقات التصوير، والمراجعة والاعتماد قبل النشر، والمراجعة البشرية لأي محتوى يستعين بالذكاء الاصطناعي، والالتزام بالهوية البصرية الرسمية للجامعة.</p><p><b>مسار الاعتماد:</b> إعداد المادة، مراجعة المحتوى، التدقيق اللغوي، مراجعة الصور والحقوق، اعتماد مدير التحرير، ثم النشر والأرشفة. لا تُنشر المشاركات الطلابية تلقائياً.</p></div>`,priv:`<div class="det"><h1>سياسة الخصوصية</h1><p>نص تجريبي: تُستخدم بيانات المشاركين لأغراض المراجعة التحريرية فقط. يُعتمد النص النهائي بعد المراجعة القانونية في الجامعة.</p></div>`};
function subForm(){return `<div class="fm"><div class="ph"><h1>شارك في مجلة جدارا</h1><p>أرسل مقالاً أو قصة نجاح أو تقريراً. لا تُنشر أي مشاركة قبل مراجعتها واعتمادها.</p></div><form id="sub"><label>الاسم</label><input name="author" required><label>الرقم الجامعي</label><input name="uid"><label>الكلية والتخصص</label><input name="sub" required><label>البريد الإلكتروني</label><input name="email" type="email" required><label>نوع المشاركة</label><select name="kind">${['مقال','قصة نجاح','تجربة طلابية','إنجاز شخصي','تقرير عن نشاط','مشاركة في مؤتمر','صور أو تقرير مصور','فكرة إبداعية'].map(k=>`<option>${k}</option>`).join('')}</select><label>عنوان المادة</label><input name="title" required><label>النص</label><textarea name="body" rows="6" required></textarea><label>المرفقات</label><input type="file" name="file"><label style="color:var(--ink)"><input type="checkbox" style="width:auto" required> أوافق على سياسة النشر والملكية الفكرية</label><p class="msg ok" id="sm"></p><button class="btn">إرسال المشاركة</button></form></div>`}

async function shrink(f){if(!f||!f.size)return null;if(!f.type.startsWith('image'))return f;try{const b=await createImageBitmap(f),s=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}catch(e){return f}}
